<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<style>
body{font-family:Arial, sans-serif; background:#f2f2f2; margin:0;}
form{border:2px solid black; background:white; padding:20px; width:400px; text-align:left; margin:20px 0 20px 20px;}
h2{text-align:center;}
label{display:block; margin-top:10px; margin-bottom:2px; font-size:14px;}
input, select, textarea{padding:4px; font-size:14px; width:95%;}
textarea{height:60px;}
.gender input{width:auto;}
button{margin-top:12px; padding:5px 12px;}
</style>
</head>
<body>

<form>
<h2>Student Registration Form</h2>

<label for="name">Full Name:</label>
<input type="text" id="name" name="name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>

<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone" required>

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob">

<label>Gender:</label>
<div class="gender">
<input type="radio" id="male" name="gender" value="Male"> Male
<input type="radio" id="female" name="gender" value="Female"> Female
<input type="radio" id="other" name="gender" value="Other"> Other
</div>

<label for="course">Course:</label>
<select id="course" name="course">
<option>B.Tech - CSE</option>
<option>B.Tech - AIML</option>
<option>B.Tech - ELCE</option>
<option>B.Tech - Mechanical</option>
<option>B.Tech - Civil</option>
</select>

<label for="address">Address:</label>
<textarea id="address" name="address"></textarea>

<label for="password">Password:</label>
<input type="password" id="password" name="password">

<br>
<div style="text-align:center;">
<button type="submit">Register</button>
<button type="reset">Reset Form</button>
</div>

</form>

</body>
</html>
