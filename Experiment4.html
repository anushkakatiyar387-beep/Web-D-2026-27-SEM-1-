<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Room Booking Form</title>
<style>
body{font-family:Arial, sans-serif; display:flex; justify-content:center;}
form{border:2px solid black; padding:20px; width:380px; text-align:center;}
label{display:block; margin-top:10px; margin-bottom:2px; font-size:14px;}
input, select, textarea{padding:3px; font-size:14px;}
textarea{width:90%; height:70px;}
button{margin-top:10px;}
</style>
</head>
<body>

<form>
<h2>Hotel Room Booking Form</h2>

<label for="name">Full Name:</label>
<input type="text" id="name" name="name">

<br>
<label for="email">Email:</label>
<input type="email" id="email" name="email">

<br>
<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone">

<br>
<label for="checkin">Check-in Date:</label>
<input type="date" id="checkin" name="checkin">

<br>
<label for="checkout">Check-out Date:</label>
<input type="date" id="checkout" name="checkout">

<br>
<label for="room">Room Type:</label>
<select id="room" name="room">
<option>Single Room</option>
<option>Double Room</option>
<option>Deluxe Room</option>
<option>Suite</option>
</select>

<br>
<label for="guests">Number of Guests:</label>
<input type="number" id="guests" name="guests" min="1">

<br>
<label for="requests">Special Requests:</label>
<textarea id="requests" name="requests"></textarea>

<br>
<button type="submit">Book Now</button>
<button type="reset">Reset Form</button>

</form>

</body>
</html>
